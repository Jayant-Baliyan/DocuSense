<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="auto">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
      </marker>
      <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
      </marker>
      <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
      </marker>
      <linearGradient id="grad-client" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="grad-server" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="grad-llm" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3f2e18;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#1a1205;stop-opacity:1" />
      </linearGradient>
    </defs>

    <rect x="20" y="20" width="820" height="480" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="430" y="48" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500" font-family="Inter, system-ui, sans-serif">AWS App Runner (Containerized)</text>

    <rect x="40" y="60" width="780" height="420" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="80" y="82" fill="#64748b" font-size="11" font-weight="500" font-family="Inter, system-ui, sans-serif">🐳 Docker Container</text>

    <rect x="60" y="100" width="200" height="140" rx="10" fill="url(#grad-client)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="160" y="125" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Next.js Frontend</text>
    <text x="160" y="148" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Inter, system-ui, sans-serif">TypeScript · App Router</text>
    <rect x="80" y="162" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="160" y="180" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">📄 PDF Upload</text>
    <rect x="80" y="198" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="160" y="216" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">💬 Streaming Chat UI</text>

    <rect x="320" y="100" width="220" height="360" rx="10" fill="url(#grad-server)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="430" y="125" text-anchor="middle" fill="#818cf8" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">Express Backend</text>
    <text x="430" y="148" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Inter, system-ui, sans-serif">Node.js · TypeScript</text>

    <rect x="340" y="162" width="180" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="430" y="178" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">🔐 API Proxy Layer</text>
    <text x="430" y="192" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">(Keys stay server-side)</text>

    <rect x="340" y="210" width="180" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="430" y="226" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">📖 PDF Text Parser</text>
    <text x="430" y="240" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">(Extract & chunk text)</text>

    <rect x="340" y="258" width="180" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="430" y="274" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">⚡ Failover Controller</text>
    <text x="430" y="288" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">(Health check + switch)</text>

    <rect x="340" y="306" width="180" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="430" y="322" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">📤 SSE Stream Handler</text>
    <text x="430" y="336" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">(Progressive response)</text>

    <rect x="340" y="354" width="180" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="430" y="370" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">🛡️ Helmet + CORS</text>
    <text x="430" y="384" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">(Security headers)</text>

    <rect x="340" y="402" width="180" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="430" y="418" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">📝 Zod Validation</text>
    <text x="430" y="432" text-anchor="middle" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">(Type-safe requests)</text>

    <rect x="600" y="100" width="200" height="180" rx="10" fill="url(#grad-llm)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="700" y="125" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="600" font-family="Inter, system-ui, sans-serif">LLM Providers</text>
    <text x="700" y="148" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Inter, system-ui, sans-serif">Dual-provider with failover</text>

    <rect x="620" y="162" width="160" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="700" y="182" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">🧠 Google Gemini API</text>
    <text x="700" y="196" text-anchor="middle" fill="#22c55e" font-size="9" font-family="Inter, system-ui, sans-serif">Primary</text>

    <rect x="620" y="218" width="160" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="700" y="238" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Inter, system-ui, sans-serif">🤖 Grok / xAI API</text>
    <text x="700" y="252" text-anchor="middle" fill="#ef4444" font-size="9" font-family="Inter, system-ui, sans-serif">Failover</text>

    <path d="M260 180 L340 180" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="300" y="172" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">POST /upload</text>

    <path d="M260 210 L340 210" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="300" y="202" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">POST /ask</text>

    <path d="M520 180 L620 182" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
    <text x="570" y="174" fill="#38bdf8" font-size="9" font-family="Inter, system-ui, sans-serif">Primary call</text>

    <path d="M520 210 L620 238" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
    <text x="570" y="232" fill="#64748b" font-size="9" font-family="Inter, system-ui, sans-serif">Failover</text>

    <path d="M620 200 L520 200" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
    <text x="570" y="196" fill="#22c55e" font-size="9" font-family="Inter, system-ui, sans-serif">Stream chunks</text>

    <path d="M340 240 L260 240" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
    <text x="300" y="232" fill="#22c55e" font-size="9" font-family="Inter, system-ui, sans-serif">SSE stream</text>

    <rect x="600" y="320" width="200" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="700" y="342" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" font-family="Inter, system-ui, sans-serif">Legend</text>
    <line x1="620" y1="358" x2="650" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="660" y="362" fill="#94a3b8" font-size="10" font-family="Inter, system-ui, sans-serif">Request flow</text>
    <line x1="620" y1="378" x2="650" y2="378" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="660" y="382" fill="#94a3b8" font-size="10" font-family="Inter, system-ui, sans-serif">Response / Stream</text>
    <line x1="620" y1="398" x2="650" y2="398" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="660" y="402" fill="#94a3b8" font-size="10" font-family="Inter, system-ui, sans-serif">Failover path</text>
    <rect x="620" y="412" width="14" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="642" y="423" fill="#94a3b8" font-size="10" font-family="Inter, system-ui, sans-serif">Internal module</text>
    <rect x="620" y="432" width="14" height="14" rx="3" fill="url(#grad-client)" stroke="#38bdf8" stroke-width="1"/>
    <text x="642" y="443" fill="#94a3b8" font-size="10" font-family="Inter, system-ui, sans-serif">Layer color</text>
  </svg>